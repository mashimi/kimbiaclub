[build]
  publish = "public"

# APK direct download — serve as-is, NOT redirected to index.html
[[redirects]]
  from = "/download/kimbiaclub.apk"
  to = "/download/kimbiaclub.apk"
  status = 200
  force = true

# Download landing page
[[redirects]]
  from = "/download"
  to = "/download/index.html"
  status = 200

# SPA: all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/download/kimbiaclub.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"KimbiaTZ-1.0.0.apk\""

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
